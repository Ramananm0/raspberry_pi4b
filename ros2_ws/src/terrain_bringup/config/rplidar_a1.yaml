rplidar_node:
  ros__parameters:
    # RPLidar A1 USB port (fixed by udev rule — see setup/99-rplidar.rules)
    serial_port:          /dev/rplidar
    serial_baudrate:      115200
    frame_id:             lidar_link
    inverted:             false
    angle_compensate:     true
    scan_mode:            Standard      # A1 only has Standard mode

    # A1 specs:
    #   Range    : 0.15 m – 12 m
    #   Scan rate: 5.5 Hz (default)
    #   Samples  : 360 (1° resolution at 5.5 Hz)
    #   Angle    : 360°
